# Dependabot updates merge themselves once ci-result passes, except new major versions (STANDARD.md 5, D90).
# Needs "Allow auto-merge" (Settings -> General) and ci-result required on main.
name: Dependabot auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: Legal-Copy7045/project-standards/.github/workflows/dependabot-automerge.yml@bba160b88041c0564769d6415d5f7f6514144cbb  # v1.2.2
