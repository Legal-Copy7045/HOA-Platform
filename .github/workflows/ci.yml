name: CI

# Pull requests run once per commit; pushes to main run after a merge. (Before,
# every commit on a PR branch ran twice: once for the push, once for the PR.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: bandit
        run: bandit -q -c pyproject.toml -r .

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: pip-audit
        # Every requirement is pinned with hashes, so nothing needs resolving.
        run: pip-audit --strict --disable-pip --no-deps -r requirements/base.txt -r requirements/dev.txt

  # The suite runs in four parallel shards (conftest.py --shard): each job
  # takes every fourth test, so the slow cross-owner URL matrix is shared out
  # too. Wall time drops from about 8 minutes to about 3.
  test-shard:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway credentials for a disposable database.
      PGHOST: localhost
      PGPASSWORD: ci-superuser
      POSTGRES_USER: postgres
      HOA_DB_NAME: hoa
      HOA_OWNER_DB_USER: hoa_owner
      HOA_OWNER_DB_PASSWORD: ci-owner
      HOA_APP_DB_USER: hoa_app
      HOA_APP_DB_PASSWORD: ci-app
      DATABASE_URL: postgres://hoa_owner:ci-owner@localhost:5432/hoa
      DB_APP_ROLE: hoa_app
      DB_APP_PASSWORD_FOR_TESTS: ci-app
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: Create database roles
        run: bash docker/postgres/init-roles.sh
      - name: Throwaway database, so skip durability
        run: |
          psql -U postgres -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: Missing migrations
        if: matrix.shard == 0
        run: python manage.py makemigrations --check --dry-run --settings=core.settings.test
      - name: pytest
        run: pytest -p no:cacheprovider --shard ${{ matrix.shard }}/4

  # One "test" check for the pull request, green only when every shard is.
  test:
    runs-on: ubuntu-24.04
    needs: [test-shard]
    if: always()
    steps:
      - name: All shards passed
        run: |
          [ "${{ needs.test-shard.result }}" = "success" ] || { echo "A test shard failed or was cancelled."; exit 1; }

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
      - name: Build image
        run: docker build -t oak-creek-portal:ci .
