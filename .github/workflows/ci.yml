name: CI

# CI per the owner's project standard 1.1.0 (D90; built on the economical CI of D86):
#  - pull request: nothing while a draft; then lint, versions, privacy guard, gitleaks on the PR's commits and the
#    compose check always, and each slow group (tests, image build and scan, page crawl, dependency audit) only when
#    the PR changes its files (job "changes", .github/changes.yaml);
#  - push to main: nothing is re-tested (the pull request did); the private-terms check, and the release path when
#    VERSION has no v<VERSION> tag yet (tag + GitHub Release; the VM deploys only release tags);
#  - weekly (Sunday 03:17 UTC, this project's slot) and by hand: everything, whole-history secret scan, audits;
#    publishes nothing (workflow_dispatch with release: true on main retries a release).
# ci-result is the only required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"  # Sundays: everything on main (STANDARD.md 1.6 slot for HOA-Portal)
  workflow_dispatch:
    inputs:
      release: {type: boolean, default: false, description: "Release VERSION if it has no tag yet (main only)"}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which groups this run needs (.github/changes.yaml). Skipped for drafts, so a draft runs nothing.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.c.outputs.release }}
      full: ${{ steps.c.outputs.full }}
      tests: ${{ steps.c.outputs.tests }}
      image: ${{ steps.c.outputs.image }}
      pages: ${{ steps.c.outputs.pages }}
      lockfiles: ${{ steps.c.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: python3 .github/scripts/changes.py

  # The standard's "quick" job, under the name people know: lint, bandit, versions.
  lint:
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: versions (VERSION, CHANGELOG.md, .github/versions.yaml)
        run: python3 .github/scripts/check_versions.py
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: bandit
        run: bandit -q -c pyproject.toml -r .

  # Dependency audit: when requirements change, and weekly for newly published advisories.
  audit:
    needs: changes
    if: needs.changes.outputs.lockfiles == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: pip-audit
        # Every requirement is pinned with hashes, so nothing needs resolving.
        run: pip-audit --strict --disable-pip --no-deps -r requirements/base.txt -r requirements/dev.txt

  # The privacy guard (.github/scripts/privacy_guard.py, loaded from main so a PR cannot weaken it).
  privacy:
    needs: changes
    if: github.event_name != 'push'
    uses: Legal-Copy7045/project-standards/.github/workflows/privacy.yml@bba160b88041c0564769d6415d5f7f6514144cbb  # v1.2.2

  # The private terms (PRIVACY_DENYLIST, environment "privacy", main only): on push to main only.
  privacy-denylist:
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    uses: Legal-Copy7045/project-standards/.github/workflows/privacy.yml@bba160b88041c0564769d6415d5f7f6514144cbb  # v1.2.2
    with: {denylist: true}
    secrets: inherit

  # Gitleaks (D57): the PR's commits; the whole history weekly and by hand. Allowances in .gitleaks.toml.
  secrets:
    needs: changes
    if: github.event_name != 'push'
    uses: Legal-Copy7045/project-standards/.github/workflows/gitleaks.yml@bba160b88041c0564769d6415d5f7f6514144cbb  # v1.2.2
    with: {full-history: "${{ needs.changes.outputs.full == 'true' }}"}

  # The suite runs in two parallel shards (conftest.py --shard): each job
  # takes every second test, so the slow cross-owner URL matrix is shared out
  # too. Two rather than four (D86): each shard repeats about a minute and a
  # half of set-up, which is billed; the wait is a few minutes longer.
  test-shard:
    name: test (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway credentials for a disposable database.
      PGHOST: localhost
      PGPASSWORD: ci-superuser
      POSTGRES_USER: postgres
      HOA_DB_NAME: hoa
      HOA_OWNER_DB_USER: hoa_owner
      HOA_OWNER_DB_PASSWORD: ci-owner
      HOA_APP_DB_USER: hoa_app
      HOA_APP_DB_PASSWORD: ci-app
      DATABASE_URL: postgres://hoa_owner:ci-owner@localhost:5432/hoa
      DB_APP_ROLE: hoa_app
      DB_APP_PASSWORD_FOR_TESTS: ci-app
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: Create database roles
        run: bash docker/postgres/init-roles.sh
      - name: Throwaway database, so skip durability
        run: |
          psql -U postgres -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: Missing migrations
        if: matrix.shard == 0
        run: python manage.py makemigrations --check --dry-run --settings=core.settings.test
      - name: pytest
        run: pytest -p no:cacheprovider --shard ${{ matrix.shard }}/2

  # One "test" line for people reading the run, green only when every shard is
  # (ci-result is the required check; this one is kept for its familiar name).
  test:
    needs: [changes, test-shard]
    if: always() && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          [ "$RESULT" = "success" ] || { echo "A test shard failed or was cancelled."; exit 1; }

  # Compose files are checked on every pull request (seconds); the image is
  # built once, in image-scan, and only when it can have changed (D86).
  docker:
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
      - name: Validate the POC/production overlay
        # A dummy tunnel token: config only interpolates it, nothing connects.
        run: TUNNEL_TOKEN=ci-not-a-token docker compose -f docker-compose.yml -f docker-compose.tunnel.yml config -q

  # Vulnerability scan of the portal image (D57). Fails on HIGH or CRITICAL
  # findings that have a fixed version (nothing to do about the others but
  # wait); the infrastructure images from the compose files are scanned too
  # and listed in the summary, so a Dependabot bump shows what it fixes.
  # Builds the image (the build check, once per run) and scans it. On a pull
  # request only when the Dockerfile, requirements, docker/ or compose files
  # changed; the weekly run scans everything again for newly published CVEs.
  image-scan:
    needs: [changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: Build image
        run: docker build -t oak-creek-portal:ci .
      - name: Scan the portal image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: oak-creek-portal:ci
          # Explicit Trivy version (never "latest"): trivy v0.69.4-0.69.6 were
          # malicious in the March 2026 supply-chain incident (GHSA-69fq-xp46-6x23).
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-portal.txt
      - name: Scan the infrastructure images (report only)
        if: always()
        env:
          TUNNEL_TOKEN: ci-not-a-token
        run: |
          cp .env.example .env
          : > trivy-infra.txt
          for image in $(docker compose -f docker-compose.yml -f docker-compose.tunnel.yml --profile local-store config --images | grep -v '^oak-creek-portal' | sort -u); do
            echo "== $image" >> trivy-infra.txt
            trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --format table "$image" >> trivy-infra.txt 2>&1 || echo "(scan failed)" >> trivy-infra.txt
          done
      - name: Portal image report (in the log)
        if: always()
        run: cat trivy-portal.txt 2>/dev/null || echo "no report"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Portal image (fails on fixable HIGH/CRITICAL)"
            echo '```'; cat trivy-portal.txt 2>/dev/null || echo "no report"; echo '```'
            echo "## Infrastructure images (report only)"
            echo '```'; cat trivy-infra.txt 2>/dev/null || echo "no report"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The regression page crawl (regression/run.py --stage page): a demo
  # community, every page for six roles on a desktop and a phone, the
  # cross-role refusals and a passkey sign-in, in a real browser. About 3
  # minutes locally; well under 15 with set-up on a runner (D57).
  # On a pull request only when it touches pages, views, URLs, templates,
  # static files, models or permissions; weekly on main (D86).
  pages:
    needs: [changes]
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway credentials. run.py uses hoa_owner/hoa_owner.
      PGHOST: localhost
      PGPASSWORD: ci-superuser
      POSTGRES_USER: postgres
      HOA_DB_NAME: hoa
      HOA_OWNER_DB_USER: hoa_owner
      HOA_OWNER_DB_PASSWORD: hoa_owner
      HOA_APP_DB_USER: hoa_app
      HOA_APP_DB_PASSWORD: ci-app
      PLAYWRIGHT_VERSION: "1.63.0"  # by hand: .github/upstreams.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: Create database roles
        run: bash docker/postgres/init-roles.sh
      - name: Browser (Playwright and Chromium)
        run: |
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Page crawl
        run: python regression/run.py --stage page
      - name: Summary
        if: always()
        run: |
          # The same list in the log and in the step summary.
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("regression/out/page.json")
          if not path.exists():
              print("No page results (set-up failed: see the log).")
          else:
              results = json.loads(path.read_text())["results"]
              failed = [r for r in results if r["status"] == "fail"]
              print(f"## Page crawl: {len(results) - len(failed)} of {len(results)} checks passed")
              for r in failed[:50]:
                  print(f"- {r['id']} {r['check']}: {r['detail'][:150]}")
          PY

  # A merged version bump is the release: tag v<VERSION> and the GitHub Release with the CHANGELOG.md section.
  # The VM builds its own image from the tag (infra/poc/update-portal.sh); nothing else is published.
  release:
    needs: [changes, privacy-denylist]
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: write
    uses: Legal-Copy7045/project-standards/.github/workflows/release.yml@bba160b88041c0564769d6415d5f7f6514144cbb  # v1.2.2
    with:
      title: "Oak Creek Farms HOA portal"

  # The only required check: fails when any needed job failed or was cancelled.
  ci-result:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, lint, audit, privacy, privacy-denylist, secrets, test-shard, test, docker, image-scan, pages, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then echo "A needed job failed or was cancelled."; exit 1; fi
