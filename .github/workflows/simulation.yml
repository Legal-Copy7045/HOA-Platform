# The accelerated simulation (D102): months of community life on a moved clock,
# with the books, accounts, append-only tables, audit and own-matter invariants
# checked every simulated day. Manual only (workflow_dispatch): never on pull
# requests or pushes, and not part of ci-result. Fictional data only; every
# outside service (Stripe, the bank, email, USPS, AI) is a fake, so nothing
# leaves the runner.
name: simulation

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Simulated months (1-24)"
        required: false
        default: "18"
      seed:
        description: "Scenario seed (same seed, same history)"
        required: false
        default: "47"
      fast:
        description: "Fewer optional events"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway credentials for a disposable database.
      PGHOST: localhost
      PGPASSWORD: ci-superuser
      POSTGRES_USER: postgres
      HOA_DB_NAME: hoa
      HOA_OWNER_DB_USER: hoa_owner
      HOA_OWNER_DB_PASSWORD: ci-owner
      HOA_APP_DB_USER: hoa_app
      HOA_APP_DB_PASSWORD: ci-app
      SIM_DATABASE_BASE: postgres://hoa_owner:ci-owner@localhost:5432
      DATABASE_URL: postgres://hoa_owner:ci-owner@localhost:5432/hoa
      DB_APP_ROLE: hoa_app
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      SIM_MONTHS: ${{ inputs.months }}
      SIM_SEED: ${{ inputs.seed }}
      SIM_FAST: ${{ inputs.fast && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - name: Create database roles
        run: bash docker/postgres/init-roles.sh
      - name: Throwaway database, so skip durability
        run: |
          psql -U postgres -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: Simulate
        # The inputs reach the script only through the environment (SIM_*),
        # never interpolated into the command line.
        run: |
          case "$SIM_MONTHS" in ''|*[!0-9]*) echo "months must be a number"; exit 1;; esac
          case "$SIM_SEED" in ''|*[!0-9]*) echo "seed must be a number"; exit 1;; esac
          python regression/simulation/sim.py --db hoa_sim
      - name: Report
        if: always()
        run: python regression/simulation/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: simulation-report
          path: |
            regression/out/simulation.html
            regression/out/simulation.json
          retention-days: 3
          if-no-files-found: warn
