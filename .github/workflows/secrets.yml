name: Secret scan

# Gitleaks (D57). Pull requests scan the commits they add (a merge to main adds
# nothing new, D86);
# the weekly run and a manual run scan the whole git history with the current
# rules. Fails on any finding. Known synthetic test values are allowed in
# .gitleaks.toml, one by one, never by whole file.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "41 6 * * 1"  # Mondays: the whole history
  workflow_dispatch:      # the whole history, on demand

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: read  # lists the pull request's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          # A personal-account repository needs no GITLEAKS_LICENSE; an
          # organization would (free, from gitleaks.io), as a repository secret.
