# Local development stack: `cp .env.example .env && docker compose up`.
#
# Ports bind to 127.0.0.1 only. Postgres and the object store publish no
# ports at all (CLAUDE.md: never expose them). The web and worker containers
# receive only the runtime (app-role) database credentials; the owner-role
# credentials go to the one-shot `migrate` service alone (decision Q8).
name: oak-creek-portal

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-core.settings.local}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  SITE_NAME: ${SITE_NAME:-Oak Creek Farms HOA}
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-}
  SEED_DEMO_ALLOWED: ${SEED_DEMO_ALLOWED:-false}
  APP_VERSION: ${APP_VERSION:-dev}
  DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-26214400}
  DOCUMENT_SCANNER: ${DOCUMENT_SCANNER:-none}
  DOCUMENT_CLAMD_ADDRESS: ${DOCUMENT_CLAMD_ADDRESS:-}
  DOCUMENT_REQUIRE_CLEAN_SCAN: ${DOCUMENT_REQUIRE_CLEAN_SCAN:-false}
  LEDGER_LATE_FEES_ENABLED: ${LEDGER_LATE_FEES_ENABLED:-true}
  BOARD_SEAT_SECOND_APPROVAL: ${BOARD_SEAT_SECOND_APPROVAL:-true}
  SIGNOFF_LINK_DAYS: ${SIGNOFF_LINK_DAYS:-14}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
  BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
  PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-none}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  PAYMENTS_LIVE_ALLOWED: ${PAYMENTS_LIVE_ALLOWED:-false}
  INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-168}
  SYSADMIN_NOMINATION_TTL_DAYS: ${SYSADMIN_NOMINATION_TTL_DAYS:-7}
  MFA_RESET_REQUEST_TTL_DAYS: ${MFA_RESET_REQUEST_TTL_DAYS:-7}
  MFA_RESET_CODE_TTL_HOURS: ${MFA_RESET_CODE_TTL_HOURS:-24}
  TIME_ZONE: ${TIME_ZONE:-America/New_York}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgres://${HOA_APP_DB_USER:?}:${HOA_APP_DB_PASSWORD:?}@postgres:5432/${HOA_DB_NAME:-hoa}
  DB_APP_ROLE: ${HOA_APP_DB_USER}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
  S3_BUCKET: ${S3_BUCKET:-hoa-private}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_REGION: ${S3_REGION:-us-east-1}
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Oak Creek Farms HOA <portal@example.com>}
  EMAIL_REDIRECT_ALL_TO: ${EMAIL_REDIRECT_ALL_TO:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
  ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-true}
  AXES_FAILURE_LIMIT: ${AXES_FAILURE_LIMIT:-5}
  AXES_COOLOFF_HOURS: ${AXES_COOLOFF_HOURS:-0.5}
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-CF-Connecting-IP}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  AUDIT_HASH_KEY: ${AUDIT_HASH_KEY:?set AUDIT_HASH_KEY in .env}
  AUDIT_IP_RETENTION_DAYS: ${AUDIT_IP_RETENTION_DAYS:-365}
  OFFICERS_REQUIRE_BOARD_SEAT: ${OFFICERS_REQUIRE_BOARD_SEAT:-true}
  OFFICERS_REQUIRE_BOARD_SEAT_CITATION: ${OFFICERS_REQUIRE_BOARD_SEAT_CITATION:-}
  ADMIN_URL: ${ADMIN_URL:-admin/}
  SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-43200}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  NO_TRUSTED_PROXY: ${NO_TRUSTED_PROXY:-false}
  PASSWORD_BREACH_CHECK_TIMEOUT: ${PASSWORD_BREACH_CHECK_TIMEOUT:-3}
  DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-600}
  S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-300}
  ATTACHMENTS_PER_OBJECT_MAX: ${ATTACHMENTS_PER_OBJECT_MAX:-40}
  MFA_ENROLLMENT_WINDOW_SECONDS: ${MFA_ENROLLMENT_WINDOW_SECONDS:-3600}
  # Installable app and alerts (optional features "push" and "sms").
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-fcm.googleapis.com,updates.push.services.mozilla.com,push.services.mozilla.com,web.push.apple.com,notify.windows.com}
  SMS_PROVIDER: ${SMS_PROVIDER:-none}
  SMS_ACCOUNT_SID: ${SMS_ACCOUNT_SID:-}
  SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
  SMS_FROM: ${SMS_FROM:-}
  SMS_API_BASE: ${SMS_API_BASE:-https://api.twilio.com}
  # Bank feed (optional feature "bank_feeds").
  BANK_FEED_TOKEN_KEY: ${BANK_FEED_TOKEN_KEY:-}
  TELLER_APPLICATION_ID: ${TELLER_APPLICATION_ID:-}
  TELLER_ENVIRONMENT: ${TELLER_ENVIRONMENT:-sandbox}
  TELLER_CERTIFICATE_B64: ${TELLER_CERTIFICATE_B64:-}
  TELLER_PRIVATE_KEY_B64: ${TELLER_PRIVATE_KEY_B64:-}

# Container logs rotate (10 MB x 3 per service) so they never fill the disk.
x-logging: &logging
  driver: local
  options: {max-size: "10m", max-file: "3"}

x-app: &app
  image: oak-creek-portal:local
  pull_policy: never   # built locally by the web service, never pulled
  logging: *logging
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # Sized for a small VM and a 44-household community.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - jit=off
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      HOA_DB_NAME: ${HOA_DB_NAME:-hoa}
      HOA_OWNER_DB_USER: ${HOA_OWNER_DB_USER:?}
      HOA_OWNER_DB_PASSWORD: ${HOA_OWNER_DB_PASSWORD:?}
      HOA_APP_DB_USER: ${HOA_APP_DB_USER:?}
      HOA_APP_DB_PASSWORD: ${HOA_APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${HOA_DB_NAME:-hoa}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # The local file store runs only with the "local-store" profile
  # (COMPOSE_PROFILES=local-store in .env). With Cloudflare R2 it isn't needed.
  seaweedfs:
    profiles: ["local-store"]
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-hoa-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      GOMEMLIMIT: 400MiB
    volumes:
      - objectdata:/data
      - ./docker/seaweedfs/start.sh:/start.sh:ro

  create-bucket:
    <<: *app
    profiles: ["local-store"]
    restart: "no"
    command: ["python", "/app/docker/seaweedfs/create-bucket.py"]
    environment: *app-env
    depends_on: [seaweedfs]

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8025:8025"   # web inbox: http://localhost:8025

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${HOA_OWNER_DB_USER:?}:${HOA_OWNER_DB_PASSWORD:?}@postgres:5432/${HOA_DB_NAME:-hoa}
    depends_on:
      postgres: {condition: service_healthy}

  web:
    <<: *app
    build: .   # the one service that builds; the others reuse the image
    command: ["web"]
    mem_limit: 768m
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      create-bucket: {condition: service_completed_successfully, required: false}
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      start_period: 20s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["worker"]
    mem_limit: 512m
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  objectdata:
