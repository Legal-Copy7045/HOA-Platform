# POC / production overlay: the site is reachable ONLY through a Cloudflare
# Tunnel. Use with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# (infra/poc/start-portal.sh runs exactly this.)
#
# Differences from local development:
#   - production settings (DEBUG off, secure cookies, HTTPS, strict hosts);
#   - the web container publishes NO port; cloudflared reaches it over the
#     private compose network, and the VM accepts no inbound connections;
#   - cloudflared has a fixed address, and only that address is trusted to
#     supply the client IP and scheme headers (decision D6);
#   - Mailpit is not started; email goes through the SMTP settings in .env.

x-production-env: &production-env
  DJANGO_SETTINGS_MODULE: core.settings.production
  DJANGO_DEBUG: "false"
  DEPLOYMENT_STAGE: ${DEPLOYMENT_STAGE:-production}
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_SECURE: "true"
  ADMIN_ENABLED: "false"
  TRUSTED_PROXY_CIDRS: 172.30.50.10/32
  CLIENT_IP_HEADER: CF-Connecting-IP
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}

services:
  # Malware scanning for every upload (decision D21). Signatures update
  # themselves; the first start downloads them (a few minutes, ~1.5 GB RAM).
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    environment:
      FRESHCLAM_CHECKS: "2"   # signature checks per day
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 5m
      timeout: 10s
      start_period: 300s
      retries: 10

  web:
    # Start without waiting for the scanner: uploads are held as "not yet
    # scanned" until it is ready, so an update does not wait minutes for it.
    depends_on:
      clamav: {condition: service_started}
    ports: !reset []
    environment: *production-env
    # The only service on both networks: cloudflared can reach web and
    # nothing else (not Postgres, not the object store) - security review E3.
    networks: [default, edge]
  worker:
    environment: *production-env
  migrate:
    environment: *production-env
  create-bucket:
    environment: *production-env

  mailpit:
    profiles: ["local-only"]

  cloudflared:
    # Follows the latest release: cloudflared cannot self-update inside a
    # container, and Cloudflare stops supporting old versions. The VM's
    # hoa-cloudflared-update.timer pulls a new image daily and restarts this
    # container only when the image changed.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (from the Cloudflare dashboard)}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      edge:
        ipv4_address: 172.30.50.10
    depends_on:
      web: {condition: service_healthy}

networks:
  # edge: cloudflared <-> web only. Dynamic addresses come from the upper
  # half, so nothing else can be handed cloudflared's fixed, trusted .10
  # (review E9).
  edge:
    ipam:
      config:
        - subnet: 172.30.50.0/24
          ip_range: 172.30.50.128/25

volumes:
  clamdata:
