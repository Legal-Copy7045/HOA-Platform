# The image's own defaults (clamav/clamav:1.4), plus one change.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Reload signatures in place instead of loading a second copy alongside the
# first: peak memory stays at about one copy (~1.2 GB) instead of two
# (~2.4 GB) on the 4 GB VM. Scanning pauses for about a minute during each
# reload; uploads in that minute wait as "not yet scanned" and are scanned
# once it's back (owner's choice, 2026-11-25; see docs/decisions.md D26).
ConcurrentDatabaseReload no
