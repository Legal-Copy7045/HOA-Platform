{# One new-password input: label above, help and errors under it. #}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.auto_id }}">{{ field.label }}<span class="required-mark" aria-hidden="true">*</span></label>
  <input type="password" name="{{ field.html_name }}" id="{{ field.auto_id }}" autocomplete="new-password" required{% if minlength %} minlength="{{ minlength }}"{% endif %}{% if field.help_text or field.errors %} aria-describedby="{% if field.help_text %}{{ field.auto_id }}_help{% endif %}{% if field.errors %} {{ field.auto_id }}_errors{% endif %}"{% endif %}{% if field.errors %} aria-invalid="true"{% endif %}>
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<ul class="errorlist" id="{{ field.auto_id }}_errors" role="alert">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
</div>
