{% extends "base.html" %}
{% block content %}
  <h1>{{ SITE_NAME }} portal</h1>
  {% if user.is_authenticated %}
    <p>You are signed in.</p>
  {% else %}
    <p>This portal is for owners and board members of {{ SITE_NAME }}. Accounts are by invitation.</p>
    <p><a class="button" href="{% url 'account_login' %}">Sign in</a></p>
  {% endif %}
{% endblock %}
