{# The home picker (D96) as a form widget; the same markup as partials/home_picker.html. Without JavaScript it is a plain text box (an exact address or lot number). #}
<div class="home-picker" data-home-picker data-suggest-url="{% url 'home_suggest' %}"{% if widget.multiple %} data-multiple{% endif %}><input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}><ul class="home-picker-list" role="listbox" hidden></ul><p class="sr-only" aria-live="polite" data-picker-status></p></div>
