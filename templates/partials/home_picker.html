{# The home picker (D96) in a hand-written form. Pass name, value, id; optional label (aria-label), placeholder, required, css, describedby, invalid, multiple. Without JavaScript a plain text box (an exact address or lot number); static/js/home-picker.js adds the type-ahead. #}
<div class="home-picker" data-home-picker data-suggest-url="{% url 'home_suggest' %}"{% if multiple %} data-multiple{% endif %}><input type="text" name="{{ name }}" id="{{ id }}" value="{{ value|default:'' }}" autocomplete="off" maxlength="{% if multiple %}4000{% else %}200{% endif %}"{% if label %} aria-label="{{ label }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if required %} required{% endif %}{% if css %} class="{{ css }}"{% endif %}{% if describedby %} aria-describedby="{{ describedby }}"{% endif %}{% if invalid %} aria-invalid="true"{% endif %}><ul class="home-picker-list" role="listbox" hidden></ul><p class="sr-only" aria-live="polite" data-picker-status></p></div>
