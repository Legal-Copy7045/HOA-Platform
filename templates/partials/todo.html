{% load portal %}<li class="todo"><a class="todo-link" href="{{ t.url }}"><span class="todo-icon tone-{{ t.tone }}">{% icon t.icon %}</span><span class="grow"><span class="title">{{ t.title }}</span><span class="small muted todo-detail">{{ t.detail }}</span></span>{% if t.overdue %}<span class="badge tone-danger">overdue</span>{% endif %}{% icon "arrow-right" "todo-arrow" %}</a></li>
