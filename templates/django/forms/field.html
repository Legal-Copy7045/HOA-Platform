{% if field.widget_type == "checkbox" %}
<div class="field checkbox{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.auto_id }}">{{ field }} {{ field.label }}</label>
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
{% else %}
<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.label %}<label for="{{ field.auto_id }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
{% endif %}
