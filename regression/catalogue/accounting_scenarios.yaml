# Accounting and payments scenarios end to end (independent QA). Every scenario ends with the
# global invariants in ledger/tests/accounting_invariants.py. `match` runs over "<stage>:<check>".
- feature: "Accounting scenarios end to end with global invariants (open charges - credit == balance, open amounts within bounds, append-only money tables refused by trigger and runtime role, online payments matched to Stripe, balanced journal naming no owner): applying payments, overpayment and credit, sale with credit, late fees, Eastern dates, aging, collections, statements and resale certificate, corrections, bounced checks, concurrency, reports"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_accounting_scenarios\\.py::test_", "^unit:ledger/tests/test_accounting_concurrency\\.py::test_"]
- feature: "Stripe payment scenarios end to end with the same invariants: card, debit and bank success with surcharge, fee and payout in the journal; declined, abandoned, expired; ACH processing, success and return; refunds, disputes, surcharge safety net; tampering (forged, foreign, replayed, mismatched, double-clicked, production with test key, manual online); payouts against the bank"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_payment_scenarios\\.py::test_"]
- feature: "Accounting QA fixes (D33-acctfix): money kept per ownership account through a sale (seller's credit on the dormant account, buyer clean, board and former-owner views, account choice on the board forms, migration of history), late fees only on that month's open dues, as-of views ignore later entries, notices state the past-due amount, refunds split surcharge and payment parts, Stripe payouts in the bank reconciliation"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_acctfix\\.py::test_", "^unit:payments/tests/test_acctfix_payments\\.py::test_", "^unit:ledger/tests/test_ledger\\.py::test_new_owner_starts_clean"]
- feature: "Money per ownership period (D34-fixmoney): a sale recorded with an earlier date moves the buyer's entries to the buyer's account (reversal + copy, never edited), late fees follow their dues, online payments stay on the payer's account dated when Stripe says they succeeded, receipts only for that account, safe poller (return with refund, never expire unanswered checkouts), migration 0017 re-dates re-applications by their reversal, dashboard due date and Pay button match My account and the payment page, no empty Stripe metadata, former owner's periods each with their own account"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_fixmoney\\.py::test_", "^unit:payments/tests/test_fixmoney_payments\\.py::test_"]
