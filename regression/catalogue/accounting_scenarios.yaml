- feature: "Stripe payment scenarios end to end with the same invariants: card, debit and bank success with surcharge, fee and payout in the journal; declined, abandoned, expired; ACH processing, success and return; refunds, disputes, surcharge safety net; tampering (forged, foreign, replayed, mismatched, double-clicked, production with test key, manual online); payouts against the bank"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_payment_scenarios\\.py::test_"]
