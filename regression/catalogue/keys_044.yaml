  match: ["^unit:core/tests/test_keys_connections.py::test_save_runs_the_test_and_records_it", "^unit:core/tests/test_keys_connections.py::test_a_failed_test_refuses_the_save", "^unit:core/tests/test_keys_connections.py::test_save_anyway_is_recorded_and_told", "^unit:core/tests/test_keys_connections.py::test_test_only_saves_nothing", "^unit:core/tests/test_keys_connections.py::test_a_format_problem_is_refused_before_any_call", "^unit:core/tests/test_keys_connections.py::test_a_full_stripe_secret_key_is_refused", "^unit:core/tests/test_keys_connections.py::test_the_(stripe|smtp2go|teller|smtp)_test_"]
