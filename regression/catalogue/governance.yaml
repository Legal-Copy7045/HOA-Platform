  match: ["^unit:governance/tests/test_committees.py::test_(no_public|filing_a|owners_cannot_create|search_finds|owner_cannot_open)"]
- feature: "Directory tabs: owners, board, committees"
  since: M3
  match: ["^unit:governance/tests/test_committees.py::test_directory"]
- feature: "Secret ballots stored unlinkable: the ballot records who voted, the choice is a separate row with no voter, lot, time or sequential id; database refuses a linked secret ballot; formal votes binding (D21)"
  since: M3
  match: ["^unit:governance/tests/test_governance.py::test_(secret_ballot_choice|open_ballots_still)"]
- feature: "ARC neighbor sign-off: adjacency from the development plan, extra addresses, portal answers or single-use expiring links, plans shown (not signed forms), printable prefilled form, scanned forms read into proposals a person confirms (automatic only when switched on), recusal"
  since: M3
  match: ["^unit:arc/tests/test_signoffs"]
