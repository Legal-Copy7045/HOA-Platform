  since: M4
  match: ["^unit:arc/tests/test_signoffs.py::test_(plan_neighbors|board_review_waits|board_removing|no_neighbors|the_automatic|an_objection|add_a_homeowner|forms_uploaded)"]
- feature: "ARC new request: kind of project always a list (starter types), planned start required, the property shown as its address (dropdown only for owners of several lots)"
