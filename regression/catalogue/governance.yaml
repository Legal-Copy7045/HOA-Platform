  since: M4
  match: ["^unit:governance/tests/test_ballot_links"]
- feature: "Elections review fixes: ballot fixed once voting opens (service + DB trigger), withdraw/accept audited, proxy ends when the grantor sells, nominate by address not owner names, leap-day term end, stuck consents withdrawable"
