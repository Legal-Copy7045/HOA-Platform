  match: ["^unit:core/tests/test_phone_layout\\.py::test_(filter_navs_swap|swap_script|request_filter_swap)", "^manual:filters switch in place"]
- feature: "Find a home on Homes and owners, Owner accounts 'With a balance', Invitations status pills; owners still refused"
  since: M5
  match: ["^unit:core/tests/test_phone_layout\\.py::test_(find_a_home|owner_accounts_with_a_balance|invitations_status_pills|owner_cannot_open_lists)"]
- feature: "Month to charge is a list of months in words (3 back to 3 ahead), already-posted months marked, next unposted month chosen; same YYYY-MM value"
