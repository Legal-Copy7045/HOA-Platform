# Open-item accounting and Stripe online payments (D32-payments). `match` runs over "<stage>:<check>".
- feature: "Open-item accounting: payments applied to specific charges (append-only applications, charge numbers, application-order rule, directed payments, prepayment drawdown, reversals reopen charges, history rebuilt with balances unchanged)"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_allocation\\.py::test_"]
- feature: "Credit card surcharge only (bank and debit no fee), capped at 3%, disclosed before paying"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_fees\\.py::test_", "^unit:ledger/tests/test_finance_ux\\.py::test_my_account_(hides|shows)_pay_online"]
- feature: "Stripe hosted Checkout in test mode: pull-only confirmation (no webhook), bound PendingCheckout, every-field verification, mode-safe keys, ACH processing and returns, refunds and disputes as board items, surcharge safety net without refund rights, receipts, payouts and three-way reconciliation"
  since: M5
  docs: docs/runbook.md
  match: ["^unit:payments/tests/test_stripe\\.py::test_", "^manual:stripe test payment"]
- feature: "Three-way reconciliation check (c): each Stripe payout appears as a bank-feed deposit of its exact net amount within 3 days, one bank line per payout, judged only where the feed has data"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_payout_bank_match\\.py::test_"]
- feature: "Stripe client refuses HTTP redirects so the key is never sent to another host (SEC-007)"
  since: M5
  match: ["^unit:payments/tests/test_stripe_redirects\\.py::test_"]
- feature: "Account statement in plain words with a \"Pay online\" QR code (D43): summary box (amount due and pay-by date, past due since, credit, nothing to pay), what the amount is made of (partly paid charges), paid-ahead months, charges not due yet, how to pay, activity with brought-forward line and running balance, tear-off slip; the QR code only when online payments are usable and the site address is set, holding a plain signed-in address that opens the reader's own home; delinquency notices carry it; hostile text stays escaped"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_statement_(layout|moves)\\.py::test_", "^unit:ledger/tests/test_letters\\.py::test_", "^manual:statement pay online qr code"]
- feature: "Automatic payments (D46): setup-mode Stripe Checkout bound to AutopaySetup, payers only with a fresh password check, only the month's assessment charged on the due day once per account-month (idempotent), card surcharge only on credit cards, bank debits recorded once settled, failures emailed and on My items, one retry for soft declines then paused, credit used first, review limit replaces the ceiling (D47), cancel and sale detach, feature off does nothing, statement sentence"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_autopay\\.py::test_", "^unit:core/tests/test_url_matrix\\.py::test_.*\\[autopay", "^manual:stripe test autopay"]
- feature: "Automatic payments once a year and board review (D47): annual schedule charges the next 12 months less credit (surcharge on credit cards over the whole amount) once per account-year, drawn down month by month by open-item allocation; bridge months before the first yearly payment and after a change of month charged monthly, no month charged twice across schedules; schedule change by payers only, audited; charges above $500 wait for a board member who does not pay for the home (never the manager), approve charges once, decline emails the payer, 14-day expiry; sale ends it and credit stays with the seller; feature off 404"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_autopay_annual\\.py::test_", "^unit:core/tests/test_url_matrix\\.py::test_.*\\[autopay_(schedule|review)\\]", "^manual:stripe test autopay annual"]
