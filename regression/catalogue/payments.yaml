# Open-item accounting and Stripe online payments (D32-payments). `match` runs over "<stage>:<check>".
- feature: "Open-item accounting: payments applied to specific charges (append-only applications, charge numbers, application-order rule, directed payments, prepayment drawdown, reversals reopen charges, history rebuilt with balances unchanged)"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_allocation\\.py::test_"]
- feature: "Credit card surcharge only (bank and debit no fee), capped at 3%, disclosed before paying"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_fees\\.py::test_", "^unit:ledger/tests/test_finance_ux\\.py::test_my_account_(hides|shows)_pay_online"]
- feature: "Stripe hosted Checkout in test mode: pull-only confirmation (no webhook), bound PendingCheckout, every-field verification, mode-safe keys, ACH processing and returns, refunds and disputes as board items, surcharge safety net without refund rights, receipts, payouts and three-way reconciliation"
  since: M5
  docs: docs/runbook.md
  match: ["^unit:payments/tests/test_stripe\\.py::test_", "^manual:stripe test payment"]
- feature: "Three-way reconciliation check (c): each Stripe payout appears as a bank-feed deposit of its exact net amount within 3 days, one bank line per payout, judged only where the feed has data"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_payout_bank_match\\.py::test_"]
- feature: "Stripe client refuses HTTP redirects so the key is never sent to another host (SEC-007)"
  since: M5
  match: ["^unit:payments/tests/test_stripe_redirects\\.py::test_"]
- feature: "Automatic payments (D40-autopay): setup-mode Stripe Checkout bound to AutopaySetup, payers only with a fresh password check, only the month's assessment charged on the due day once per account-month (idempotent), card surcharge only on credit cards, bank debits recorded once settled, failures emailed and on My items, one retry for soft declines then paused, credit used first, ceiling held for the board, cancel and sale detach, feature off does nothing, statement sentence"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:payments/tests/test_autopay\\.py::test_", "^unit:core/tests/test_url_matrix\\.py::test_.*\\[autopay", "^manual:stripe test autopay"]
