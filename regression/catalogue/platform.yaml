# Platform: audit, append-only, workflow, configuration, security review, pages, deployment.
- feature: "Audit log: append-only events, IP retention, metadata allowlist"
  since: M1
  match: ["^unit:audit/tests", "^unit:core/tests/test_request_id"]
- feature: "Append-only records enforced in code, by trigger and by database grants"
  since: M1
  match: ["^unit:core/tests/test_append_only_coverage", "^unit:core/tests/test_db_roles"]
- feature: "Workflow engine"
  since: M2
  match: ["^unit:core/tests/test_workflow"]
- feature: "Two people can perform every action (coverage check)"
  since: M1
  match: ["^unit:core/tests/test_check_coverage"]
- feature: "Production settings refuse unsafe configuration; trusted proxy only"
  since: M1
  match: ["^unit:core/tests/test_production_settings", "^unit:core/tests/test_trusted_proxy", "^ci:production settings"]
- feature: "Logs and email carry no personal data or tokens"
  since: M1
  match: ["^unit:core/tests/test_logging", "^unit:core/tests/test_email"]
- feature: "Security review 2026-11 regressions"
  since: 2026-11
  docs: docs/security-review-2026-11.md
  match: ["^unit:core/tests/test_security_review"]
- feature: "Navigation and home dashboards"
  since: UI sprint
  match: ["^unit:core/tests/test_dashboard_nav", "^unit:core/tests/test_health"]
- feature: "Every page renders for every role without errors, on desktop and phone"
  since: UI sprint
  match: ["^page:(board|owner|manager|auditor): "]
- feature: "Code quality and supply chain (lint, bandit, migrations, dependencies, CI hygiene)"
  since: M1
  match: ["^ci:"]
- feature: "POC deployment: Cloudflare Access, tunnel, TLS, deploy and restore"
  since: M1
  docs: docs/runbook.md
  match: ["^live:", "^manual:(deploy|restore)"]
- feature: "Sidebar count bubbles: each menu entry shows the number of items waiting on you (from the My items queue, scoped)"
  since: M3
  match: ["^unit:core/tests/test_nav_counts"]
- feature: "Backups: file store export/import round trip (unsafe archive paths ignored), off-site upload guarded; health checks with throttled sysadmin alerts and error counting"
  since: M4
  match: ["^unit:core/tests/test_backups", "^unit:core/tests/test_monitoring"]
- feature: "Routine updates immediately or as a weekly digest (links only); official notices always immediate"
  since: M4
  match: ["^unit:comms/tests/test_digest"]
- feature: "Bulk onboarding on Invitations and sign-ups: sign-up status, invite everyone, reminders, letters for owners without email (invitations only to the email on record)"
  since: M4
  match: ["^unit:accounts/tests/test_onboarding"]
- feature: "Feature switches: board turns optional features on and off (reservations off by default); a switched-off feature leaves the menu and my items and its pages answer 404; records kept; switching audited; sysadmin and owners cannot switch"
  since: M4
  match: ["^unit:core/tests/test_features"]
- feature: "D25 updates from System status: Check now and Install update only record an audited request (sysadmin); the VM agent passes values as psql variables; agent-not-running shown"
  since: M4
  match: ["^unit:core/tests/test_monitoring.py::test_(update_controls|agent_script|send_me_a_test)"]
- feature: "Dates are Eastern local dates (America/New_York): no UTC .date() or server date.today() in product code"
  since: M4
  match: ["^unit:core/tests/test_local_dates"]
- feature: "Deployment scripts (review R2): restore drill uses only its own empty file store and checks every file restored; backups carry a stamped keyed checksum with a derived key, never on a command line, required before restoring; move to R2 keeps the secret off command lines and compares counts; updates install only from main; every .env.example setting reaches the containers"
  since: M4
  docs: docs/runbook.md
  match: ["^unit:core/tests/test_infra_scripts", "^manual:(nightly backup writes|restore drill uses|restore drill refuses|install update refuses|move files to R2|push and SMS settings)"]
- feature: "Host security (harden-host.sh): automatic security updates, auditd watches, nightly AIDE check, Falco runtime alerts emailed to sysadmins (host_alert, audited, capped); System status Host security card"
  since: M4
  match: ["^unit:core/tests/test_monitoring.py::test_(host_alert|status_page_shows_host_security|harden_script)"]
- feature: "Off-site backups (D31): upload to a locked R2 bucket, complete backups listed and downloaded, lock probe audited, Backups health check (local and off-site age, lock verified), restore drill from off-site"
  since: M4
  match: ["^unit:core/tests/test_offsite"]
- feature: "Off-site restore drill refuses a backup whose signed stamp is not the stamp in its object name, or is in the future (R2-002)"
  since: M5
  match: ["^unit:core/tests/test_infra_scripts.py::test_(offsite_stamp_must_match|restore_drill_compares)"]
- feature: "Host alerts: AIDE baseline, audit checkpoint and Falco offset advance only after the alert reached a sysadmin; host_alert exits non-zero when it sent to nobody (R2-006)"
  since: M5
  match: ["^unit:core/tests/test_infra_scripts.py::test_(integrity_baseline|falco_offset|timer_scripts)", "^unit:core/tests/test_host_alert_delivery.py::test_"]
- feature: "Falco apt key trusted only with Falco's published fingerprint; mismatch stops the script; only the pinned key goes into the keyring (R2-009)"
  since: M5
  match: ["^unit:core/tests/test_infra_scripts.py::test_falco_key_is_pinned"]
- feature: "Server tasks (D36): sysadmins start backups, restore drills and other host tasks from a fixed allowlist; one at a time; the board sees the history; audited; the VM agent maps the kind in one case statement and writes back through psql variables"
  since: M5
  match: ["^unit:core/tests/test_host_tasks", "^manual:server tasks on the VM"]
- feature: "Release numbers (D37): VERSION is MAJOR.MINOR.PATCH with a CHANGELOG entry; System status shows the release, the build and an update's number; the agent reads it safely"
  since: M5
  match: ["^unit:core/tests/test_versioning\\.py::test_"]
- feature: "CI runs the suite in four parallel shards (pytest --shard K/N, round robin); every test lands in exactly one shard; one summary 'test' check"
  since: M5
  match: ["^unit:core/tests/test_ci_shards\\.py::test_"]
- feature: "Install tonight (D38): System status schedules the update for the next 4:00 am Eastern (cancellable, audited); the agent turns a due schedule into a request, tolerant of an unmigrated database"
  since: M5
  match: ["^unit:core/tests/test_monitoring\\.py::test_(next_update_window|install_tonight|agent_turns_a_due_schedule)"]
- feature: "Walkthrough tooling: the walkthrough stage runs only with --stage walkthrough or --with-walkthrough (own database, port and lane; WALK- IDs); its report shows menus per role, failing checks with thumbnails under a size budget, and reviewer findings by group"
  since: M5
  match: ["^unit:regression/tests/test_walkthrough_tooling"]
- feature: "Scanner figures and server resources (D39): signature age, 7-day scan counts, files waiting; memory without cache, swap, load from /proc; Server memory alert only after 10 minutes low"
  since: M5
  match: ["^unit:core/tests/test_resources_and_scanner\\.py::test_"]
