# Installable app, push notifications and urgent text messages (Milestone 4, comms app).
# `match` runs over "<stage>:<check>".
- feature: "Installable app: manifest and root service worker behind sign-in, static files cached only, strict CSP"
  since: M4
  match: ["^unit:comms/tests/test_pwa_push.py::test_(manifest|service_worker|signed_in_pages|content_security)", "^manual:install the app"]
- feature: "Push notifications: RFC 8291/8292 without new dependencies, known push services only, own devices only, title and link only, digest and legal notices respected"
  since: M4
  match: ["^unit:comms/tests/test_pwa_push.py::test_(encryption|vapid|only_known|post_refuses|generate_vapid|subscribe|people_see|scoped_manager|updates_push|no_push|legal_notices|gone_devices|other_failures|links_outside|web_push_sender)", "^manual:push notification arrives"]
- feature: "Urgent text messages: verified opt-in (hashed codes, 10 minutes, rate-limited), board-only urgent notices with counts-only audit, STOP handling, Twilio-compatible provider"
  since: M4
  match: ["^unit:comms/tests/test_sms.py::test_", "^manual:urgent text arrives"]
- feature: "Push limits (review R2-007): at most 10 devices per login (oldest dropped), adding devices rate-limited per login, a device removed after repeated failures or when its host does not exist, push on its own queue one job at a time so email is never held up"
  since: M4
  match: ["^unit:comms/tests/test_pwa_push.py::test_(a_login_keeps|adding_devices|a_device_is_removed|a_push_host|push_runs)"]
- feature: "Turning alerts off always works: 'Turn off on all my devices' and 'Stop texts and remove my number' answer and show on My profile whenever the user has a subscription or number, even with push or texts switched off; sign-ups stay off (R2-008)"
  since: M4
  match: ["^unit:comms/tests/test_sms.py::test_(number_can_be_removed_while|stop_texts_only_touches)", "^unit:comms/tests/test_pwa_push.py::test_push_can_be_turned_off_while"]
