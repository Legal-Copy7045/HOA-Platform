  since: M5
  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_books\\.py::test_(services_refuse|trigger_refuses|corrections_post|reopen_needs)"]
- feature: "Financial statements (D71): balance sheet balances by fund, income, reserve activity, annual accounting figure, journal export layout with bank lines and funds, QuickBooks layout without names, downloads and permissions, pages load"
