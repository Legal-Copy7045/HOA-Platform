  docs: docs/decisions.md
  match: ["^unit:ledger/tests/test_books\\.py::test_(auto_close|not_before|uncoded_line|missing_bank|difference_needs|unpaired|undeposited|negative_fund|late_fees|own_home|reserve_contribution)"]
