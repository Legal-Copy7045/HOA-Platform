  match: ["^unit:ledger/tests/test_books\\.py::test_(balance_sheet|annual_accounting|journal_export|statement_downloads|board_pages)"]
- feature: "Year close and the year-end package (D71): the year closes by itself after its months, builds the signed package with every part, tampering and a wrong key are detected, downloads board and auditor only and audited with counts"
