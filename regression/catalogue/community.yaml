# People, lots, ownership, seats, roles, settings, directory (community app).
- feature: "Role-scoped access: owners see only their lots; board, ARC, auditor, manager, sysadmin limits"
  since: M1
  match: ["^unit:community/tests/test_authorization", "^unit:core/tests/test_scoping", "^unit:core/tests/test_mixins", "^page:owner is refused"]
- feature: "Every page refuses another owner's lot (cross-owner URL matrix)"
  since: M1
  match: ["^unit:core/tests/test_url_matrix"]
- feature: "Ownership and lot transfers; access ends with ownership"
  since: M1
  match: ["^unit:community/tests/test_ownership"]
- feature: "Board pages, seats, offices, approvals"
  since: M1
  match: ["^unit:community/tests/test_board", "^unit:community/tests/test_sysadmin_nomination"]
- feature: "Community definition: governing rules with citations, dues, common areas"
  since: M2
  match: ["^unit:community/tests/test_community_definition"]
- feature: "Owner profile and opt-in directory"
  since: M2
  match: ["^unit:community/tests/test_profile_directory"]
- feature: "Management commands: bootstrap, demo data, break-glass, rescan"
  since: M1
  docs: docs/runbook.md
  match: ["^unit:community/tests/test_commands"]
- feature: "Change history protected"
  since: M1
  match: ["^unit:community/tests/test_history_protection"]
- feature: "Homeowner view: board and manager see one lot's owner view, read-only and audited"
  since: M3
  match: ["^unit:core/tests/test_owner_preview"]
- feature: "Sign-in page background (desktop and phone), uploaded on the Branding page; images re-encoded"
  since: M3
  match: ["^unit:community/tests/test_branding"]
- feature: "Accounts: numbered per ownership period, dormant on sale; authorized, view-only and tenant contacts; extra contact details and notice emails"
  since: M3
  match: ["^unit:community/tests/test_accounts.py::test_(recording|a_second|a_sale|account_number|authorized|view_only|tenant|contact_sees|ending|board_adds|owners_cannot_add|no_contacts|my_account|owner_adds|owner_cannot_remove|invalid_extra|meeting_notice)"]
- feature: "Former owners: read-only login showing only their own records from their time"
  since: M3
  match: ["^unit:community/tests/test_accounts.py::test_(former_owner|owners_cannot_open_my_history)"]
- feature: "Community settings show PA law guidance (source, statute, example); statutory fallbacks for meeting notice, quorum and resale deadline"
  since: M3
  match: ["^unit:community/tests/test_pa_law"]
- feature: "Separate Homeowner and Board menus (Dashboard, My home, own ARC/notices/requests); owners ask the board to add or remove people on their account; POC command to test as an owner"
  since: M3
  match: ["^unit:community/tests/test_owner_side.py::test_(menu|board_owner|owner_only|my_lot_moved|owner_asks|requester_on|only_owners|other_owners|owner_withdraws|demo_make)"]
- feature: "ARC project types configured by the board; owners choose one"
  since: M3
  match: ["^unit:community/tests/test_owner_side.py::test_(board_configures|retired_types)"]
- feature: "Lot and owner register import (check, then commit; links the first officer by email); board members are homeowners first and keep it after leaving the board"
  since: M3
  match: ["^unit:community/tests/test_register_and_board_owners"]
- feature: "Board roster (current and previous accounts) with audited, formula-safe CSV export; list tools (status, dates, paging, export) on board lists; FAQ; dashboard welcome message"
  since: M3
  match: ["^unit:community/tests/test_roster_lists_faq"]
