# Sign-in, MFA, invitations, recovery (accounts app). `match` runs over "<stage>:<check>".
- feature: "Invite-only accounts: invitations to the address on file, board-created, single-use links"
  since: M1
  docs: docs/decisions.md
  match: ["^unit:accounts/tests/test_invitations", "^manual:invitation email"]
- feature: "Mandatory MFA (passkey or app) for every account; enrollment only in the accepting session"
  since: M1
  docs: docs/decisions.md
  match: ["^unit:accounts/tests/test_signin", "^page:passkey: ", "^manual:(passkey sign-in|authenticator app|enrollment window)"]
- feature: "Passwords: 12+ characters, common and breached-password checks (fail-open)"
  since: M1
  match: ["^unit:accounts/tests/test_passwords"]
- feature: "Assisted reset of a lost authenticator by two board members"
  since: M1
  docs: docs/runbook.md
  match: ["^unit:accounts/tests/test_mfa_reset", "^manual:assisted reset"]
- feature: "Login model, session invalidation and lockout"
  since: M1
  match: ["^unit:accounts/tests/test_user_model"]
- feature: "Guided sign-in setup (step bar, passkey first, recovery codes with Print and I've saved them; no sidebar until done); labelled login page with the passkey first; sign-in help page naming the board contact; lockout wait from the setting"
  since: M4
  match: ["^unit:accounts/tests/test_signin_setup::test_", "^manual:(guided sign-in setup on a phone|recovery codes print)"]
- feature: "Quarterly access review: every login with roles, seats, offices, last sign-in, MFA and flags; append-only review record by a board member; My items reminder after 90 days; board only"
  since: M4
  match: ["^unit:accounts/tests/test_access_review"]
- feature: "Invitation and enrollment review (D59): every URL sends a login without a passkey or app to setup or signs it out; reviewed list of open pages; new setup link for logins that never enrolled (board only, Person's email, refused after any enrollment or reset); Sign-ups status and My items after 7 days; expired-link page; sign-out audited"
  since: M4
  docs: docs/decisions.md
  match: ["^unit:accounts/tests/test_enrollment_review", "^manual:(accept an invitation on a phone and a laptop|enrollment window expiry)"]
- feature: "Forgot password (D58): emailed single-use link, then the passkey, app or a recovery code, then a new password; never signs in; 'Your password was changed' to every address"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:accounts/tests/test_lockout_prevention.py::test_(reset|new_password|wrong_code|app_code|a_recovery_code|account_without|login_page)"]
- feature: "Fewer lockouts (D58): My items asks for a backup sign-in method and new recovery codes; recovery codes shown once with a printable page and a text file, audited"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:accounts/tests/test_lockout_prevention.py::test_(one_strong|two_strong|no_backup|two_or_fewer|backup_item|codes_are|download_and)", "^manual:recovery codes print"]
- feature: "Self-service account recovery for ordinary logins (D58): neutral form, single-use links, wait from the board setting (never under 48 h), alerts to every email, the text number and the board, cancel by the person, the board or a normal sign-in, finish only in the link's browser session, old authenticators removed; staff roles never"
  since: M5
  docs: docs/runbook.md
  match: ["^unit:accounts/tests/test_recovery.py::test_", "^manual:recover an owner account on a phone end to end"]
- feature: "Post-recovery lock (D58): votes, ballots, surveys, proxies, contact, notice, text and mailing changes, autopay and account change requests refused in the services until the lock ends; banner; board review item for seven days"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:accounts/tests/test_recovery.py::test_(the_lock|lock_|banner|directory_and|board_sees)"]
- feature: "Can't sign in? (D62): one help link on the sign-in page; a guided page asks what's wrong and routes to the password reset, a recovery code or other device, account recovery, Ask the board for a new setup link (neutral, rate-limited, My items entry only for a login that never enrolled), board-assisted help without email, and the configured lockout wait; nothing reveals whether an account exists; old URLs still work"
  since: M5
  docs: docs/decisions.md
  match: ["^unit:accounts/tests/test_cant_sign_in.py::test_", "^unit:core/tests/test_url_matrix.py::test_signin_help_pages_", "^manual:can't sign in on a phone"]
