# Checks that need a person (a real phone, a real mailbox, the real VM). Not run
# automatically: every report lists them as "need a person" until done.
# `last` = when it was last done and what happened (no names, no addresses).
- key: passkey sign-in on a phone
  check: "Sign in with a passkey on an iPhone and an Android phone through portal-dev (Cloudflare Access first)."
  steps: "New private window; Access login; portal 'Sign in with a passkey'; confirm the home page loads."
  last: "2026-11-25: passkey and authenticator app set up by the first officer on desktop"
- key: authenticator app codes accepted
  check: "A code from an authenticator app is accepted at sign-in, including one taken just before it rolls over."
  steps: "Sign out; sign in with password; enter a code with 2-3 seconds left on it."
  last: "2026-11-25: works after the tolerance fix"
- key: invitation email arrives and works
  check: "A board invitation reaches a real mailbox (Hostinger, SPF/DKIM pass) and the link creates the account in that browser."
  steps: "Invite a test person; check the message headers for dkim=pass; accept; add a passkey within the hour."
  last: "not done yet (POC redirects mail to one inbox)"
- key: enrollment window expiry
  check: "An invited person who closes the browser before adding a passkey or app is shown 'Your account isn't set up yet' next time and needs a new invitation."
  steps: "Accept an invitation, close the browser without enrolling; sign in again with the password."
  last: "not done yet"
- key: assisted reset end to end
  check: "Two board members reset a lost authenticator; the code works once in the owner's browser; the owner enrolls a new one."
  steps: "Board member A starts the reset, B approves and reads the code by phone, the owner signs in and enters it."
  last: "not done yet (needs a second board member)"
- key: restore drill
  check: "Restore last night's encrypted backup into a scratch VM and run migrations (required before real data)."
  steps: "docs/runbook.md 'Backups'; record the time it took."
  last: "not done yet"
- key: deploy on the POC VM
  check: "git pull and start-portal.sh on the VM bring every service up healthy, tunnel registered."
  steps: "VM console as hoa: cd /opt/hoa-portal && git pull --ff-only && sudo bash infra/poc/start-portal.sh"
  last: "2026-11-25: Milestone 1 deploy healthy"
- key: gemini reads a scanned acknowledgement form
  check: "With GEMINI_API_KEY set on the POC, a hand-filled acknowledgement form is read into the right proposals."
  steps: "Print an ARC request's acknowledgement form; fill two blocks by hand (one no objection, one object); scan or photograph it; upload it under 'Neighbor not online? Use the paper form'; press 'Read automatically'; refresh after a minute; confirm both."
  last: ""
- key: restore drill on the POC VM
  check: "The newest nightly backup restores into a throwaway copy and passes its checks."
  steps: "sudo bash /opt/hoa-portal/infra/poc/restore-drill.sh"
  last: ""
- key: nightly backup writes a stamped keyed checksum
  check: "After a backup run, HMAC-SHA256 in the newest backup folder starts with 'format hoa-backup-mac-v2' and 'stamp <folder name>', and the key never shows in the process list."
  steps: "sudo bash /opt/hoa-portal/infra/poc/backup.sh; sudo head -2 /var/backups/hoa-portal/<newest>/HMAC-SHA256; while it runs, in a second console: ps -eo args | grep -c \"$(sudo cat /root/hoa-backup.key | cut -c1-12)\" (expect 1, the grep itself); python3 -I /opt/hoa-portal/infra/poc/backup_mac.py verify <folder> /root/hoa-backup.key prints the stamp."
  last: ""
- key: restore drill uses its own file store
  check: "With the portal on R2 (or the local store), the drill reports 'N of N files in the backup restored', passes, and the live bucket gains no objects and no healthcheck probe."
  steps: "Note the live bucket's object count (Cloudflare dashboard or System status); sudo bash /opt/hoa-portal/infra/poc/restore-drill.sh; confirm the counts line and 'Restore drill passed ... made at <stamp>'; the live count is unchanged."
  last: ""
- key: restore drill refuses a tampered or swapped backup
  check: "The drill refuses before decrypting when a backup's checksum file is deleted, or when db.dump.enc is replaced by an older backup's copy, and restores an older-format backup only with --allow-unsigned (with a warning)."
  steps: "sudo cp -a the newest backup folder to /root/drill-test/<same name>; delete HMAC-SHA256 there and run restore-drill.sh on it (expect refusal mentioning --allow-unsigned); restore the file, copy an older backup's db.dump.enc over it (expect 'fails its keyed checksum'); remove /root/drill-test afterwards."
  last: ""
- key: install update refuses a non-main branch
  check: "With the VM's checkout on a branch other than main and no ALLOW_BRANCH in .env, Install update on System status ends as failed with 'updates install only from main'; on main it installs."
  steps: "Only if the VM is still on the old feature branch: press Install update and read the message; then as hoa: git -C /opt/hoa-portal checkout main; press Install update again."
  last: ""
- key: move files to R2 compares counts
  check: "move-files-to-r2.sh prints the exported count, the copied count, and 'Files in R2' matches before saying Done; ps during the run never shows the R2 secret."
  steps: "Only when moving the POC to R2 (decision D29 keeps the local store for now): sudo bash /opt/hoa-portal/infra/poc/move-files-to-r2.sh; read the counts."
  last: ""
- key: push and SMS settings reach the containers
  check: "VAPID_* and SMS_* filled in .env are seen by web and worker after a restart."
  steps: "Fill VAPID keys from generate_vapid_keys into .env; sudo bash infra/poc/start-portal.sh; docker compose ... exec web python -c \"import os; print(bool(os.environ.get('VAPID_PUBLIC_KEY')))\" prints True; My profile offers 'Notifications on this device' once the board switches push on."
  last: ""
- key: health alert email arrives
  check: "Stopping the worker produces a health email to the sysadmins within 30 minutes, and a recovery email after restarting it."
  steps: "docker compose ... stop worker; wait; check inbox; docker compose ... start worker"
  last: ""
- key: ballot link on a phone
  check: "A personal ballot link opens on a phone after sign-in, asks for the password or passkey before the ballot is recorded, and a forwarded copy does nothing."
  steps: "Open a test election; open the email on a phone; sign in; cast; forward the same email to a second test owner and open it there (expect 'can't be used')."
  last: ""
- key: install update button
  check: "System status shows Update available after a push to main, and Install update brings the VM to the new version without terminal access."
  steps: "Push a harmless change to main; within 15 minutes System status shows Update available; press Install update; within a few minutes the Version box shows the new commit."
  last: ""
- key: scanner reloads in place
  check: "On the VM, ClamAV runs with ConcurrentDatabaseReload disabled and memory stays near one signature copy during a reload."
  steps: "docker compose exec clamav clamconf -n | grep Concurrent (expect disabled); watch docker stats during a freshclam update; upload a test file just after and see it scanned once the reload finishes."
- key: guided sign-in setup on a phone
  check: "A new owner accepts an invitation on a phone and follows the three steps: password (show-password toggle works), 'Use this phone's fingerprint or face' creates a passkey, recovery codes shown; no menu until 'I've saved them'."
  steps: "Invite a test person; open the link on an iPhone and an Android phone; finish all three steps; confirm the home page then shows the menu."
  last: ""
- key: recovery codes print
  check: "On the recovery codes step, Print shows only the codes and the heading (no buttons, step bar or footer)."
  steps: "During setup or from Sign-in and security > Show codes, press Print and look at the print preview."
- key: install the app
  check: "The portal installs to a phone home screen and a desktop, opens standalone with the leaf icon, still asks for sign-in, and shows no cached page after signing out."
  steps: "Android Chrome: menu, Install app. iPhone Safari: Share, Add to Home Screen. Desktop Chrome: install icon. Open it, sign in, browse; sign out; reopen offline: expect the browser's offline page, never a portal page."
  last: ""
- key: push notification arrives
  check: "With VAPID keys set and the push feature on, a device that turned notifications on gets an alert with a short title and opens the right signed-in page."
  steps: "python manage.py generate_vapid_keys into .env; Admin, Features: Push on; My profile: Turn on for this device; have a board member reply on one of your requests; tap the alert; expect sign-in (if signed out) then the request page."
  last: ""
- key: urgent text arrives
  check: "With a Twilio test account and the sms feature on, an owner confirms a number by code and receives the board's urgent text with the link and STOP note; replying STOP stops later texts."
  steps: "Set SMS_PROVIDER=twilio and test credentials; Admin, Features: Urgent text messages on; My profile: enter a mobile number, enter the texted code; Board, Urgent texts: send; reply STOP; send again and check the owner is no longer counted."
- key: my account how to pay
  check: "On a phone, My account reads clearly for an owner: amount and Due by, who to make checks payable to and where to mail them, a statement with Charges / Payments / Balance that fits or scrolls sideways."
  steps: "Set Remit to under Finance, Letters; sign in as a demo owner with a balance on a phone; open My account."
  last: ""
- key: letters unsaved changes warning
  check: "On Finance, Letters, typing in one section and then saving another asks first; leaving the page with unsaved edits asks first."
  steps: "Edit the letterhead, press Save wording on a notice: a prompt names the letterhead section. Edit again and click another menu link: the browser asks to leave."
  last: ""
- key: settings dues confirmation
  check: "Community settings shows '= $75.00 per month' while typing dues, and asks for confirmation when dues change by more than 25%."
  steps: "Community settings, Monthly dues: type 75; then type 150 and save: a confirmation page names the old and new amounts."
- key: reservation booking on a phone
  check: "With Common area reservations switched on, an owner books an area on a phone (date and time pickers work), gets the email, and a board member confirms it from My items."
  steps: "Admin > Features: switch on reservations; Booking rules: make one area bookable; as an owner request a slot on a phone; as a board member confirm it; check the owner's email and the Calendar page."
- key: sidebar groups on a phone
  check: "On a phone, the Menu button opens the sidebar with focus inside it; Board, Finance and Admin start closed unless the current page is inside; a group opened or closed stays that way on the next page."
  steps: "Sign in as a board member on a phone; open Menu; open Finance; go to another page; open Menu again (Finance still open); press Escape or tap outside (focus returns to Menu)."
  last: ""
- key: keyboard and screen reader menu
  check: "With the phone-width menu closed, Tab never reaches hidden menu links, and VoiceOver or TalkBack reads count bubbles as 'N waiting on you' and error messages at once."
  steps: "Narrow a desktop browser below 820px; Tab through the page; then try a failed form (for example a proxy with no holder) with a screen reader on."
  last: ""
- key: election ballot limit
  check: "On an election ballot with 2 seats, a third box can't be ticked, the count reads '2 of 2 chosen', and Cast ballot asks 'Cast your ballot for X and Y?' before the password or passkey step."
  steps: "Open a test election to voting; sign in as a test owner; tick candidates; press Cast ballot."
  last: ""
- key: print a page with values
  check: "Printing Community settings or an owner statement shows the values in the fields and leaves out buttons and menus."
  steps: "Open the page; browser Print preview."
- key: owner ARC on a phone
  check: "On a phone, an owner asks for approval of a project: Kind's guidance appears when a kind is picked, 'If other, where?' shows only for Other, the camera and photo library are offered for plans and photos, several photos upload at once with thumbnails, and the checklist sends the request."
  steps: "Sign in as a demo owner on an iPhone and an Android phone; My architectural requests; Ask for approval of a project; pick a kind and Other; save; add three photos at once; send."
  last: ""
- key: neighbor review page on a phone
  check: "A signed-in neighbor sees the plans above the answer, large choice cards, and the comment becomes required when 'I object' is picked (before sending)."
  steps: "As the neighbor, open the emailed link on a phone; pick 'I object' and try to send with no comment; then pick 'no objection' and send."
  last: ""
- key: host hardening on the VM
  check: "After harden-host.sh, System status shows Host security with every line on; touching the .env sends an audit email the next morning; a shell opened inside the web container produces a Falco email within 10 minutes."
  steps: "sudo bash infra/poc/harden-host.sh; open System status after a minute; sudo touch /opt/hoa-portal/.env; docker compose exec web sh -c 'echo hi' and wait 10 minutes; check the sysadmin inbox; next morning check for the audit email."
  last: ""
- key: off-site backups locked
  check: "setup-offsite-backups.sh reports 'Locked'; the bucket shows the backup files under backups/; deleting one in the Cloudflare dashboard is refused; System status Backups shows the off-site age and 'lock verified'; restore-drill.sh --from-offsite passes."
  steps: "Follow docs/runbook.md 'Off-site backups that cannot be deleted'; then try deleting a backups/ object in the R2 dashboard; open System status; run the off-site drill."
  last: ""
- key: meeting packet
  check: "The board packet PDF opens in a PDF reader with the cover, agenda, minutes note, financial totals, the open-items page marked Confidential – board only, and the attachment index; the .zip opens and holds the PDF and the listed attachments; the owner packet shows on the meeting page for an owner and has no receivables, violations or collections."
  steps: "As a board member open a meeting, Build packet, build both variants with an attachment; open both PDFs and the .zip; sign in as an owner and open the meeting page and the owner packet."
  last: ""
- key: survey answering on a phone
  check: "An owner answers a survey with every kind of question on a phone, and the board sees the results and downloads the CSV (anonymous survey: no names in it)."
  steps: "Board: Voting > Surveys, create a draft with one question of each kind, open it with email on; owner: open the emailed link, answer at phone width; board: Results, Download CSV."
  last: ""
