  last: "not done yet (needs a second board member)"
- key: restore drill
  check: "Restore last night's encrypted backup into a scratch VM and run migrations (required before real data)."
  steps: "docs/runbook.md 'Backups'; record the time it took."
  last: "not done yet"
- key: deploy on the POC VM
  check: "git pull and start-portal.sh on the VM bring every service up healthy, tunnel registered."
  steps: "VM console as hoa: cd /opt/hoa-portal && git pull --ff-only && sudo bash infra/poc/start-portal.sh"
  last: "2026-11-25: Milestone 1 deploy healthy"
- key: gemini reads a scanned acknowledgement form
  check: "With GEMINI_API_KEY set on the POC, a hand-filled acknowledgement form is read into the right proposals."
  steps: "Print an ARC request's acknowledgement form; fill two blocks by hand (one no objection, one object); scan or photograph it; upload it under 'Neighbor not online? Use the paper form'; press 'Read automatically'; refresh after a minute; confirm both."
  last: ""
- key: restore drill on the POC VM
  check: "The newest nightly backup restores into a throwaway copy and passes its checks."
  steps: "sudo bash /opt/hoa-portal/infra/poc/restore-drill.sh"
  last: ""
- key: nightly backup writes a stamped keyed checksum
  check: "After a backup run, HMAC-SHA256 in the newest backup folder starts with 'format hoa-backup-mac-v2' and 'stamp <folder name>', and the key never shows in the process list."
  steps: "sudo bash /opt/hoa-portal/infra/poc/backup.sh; sudo head -2 /var/backups/hoa-portal/<newest>/HMAC-SHA256; while it runs, in a second console: ps -eo args | grep -c \"$(sudo cat /root/hoa-backup.key | cut -c1-12)\" (expect 1, the grep itself); python3 -I /opt/hoa-portal/infra/poc/backup_mac.py verify <folder> /root/hoa-backup.key prints the stamp."
  last: ""
- key: restore drill uses its own file store
  check: "With the portal on R2 (or the local store), the drill reports 'N of N files in the backup restored', passes, and the live bucket gains no objects and no healthcheck probe."
  steps: "Note the live bucket's object count (Cloudflare dashboard or System status); sudo bash /opt/hoa-portal/infra/poc/restore-drill.sh; confirm the counts line and 'Restore drill passed ... made at <stamp>'; the live count is unchanged."
  last: ""
- key: restore drill refuses a tampered or swapped backup
  check: "The drill refuses before decrypting when a backup's checksum file is deleted, or when db.dump.enc is replaced by an older backup's copy, and restores an older-format backup only with --allow-unsigned (with a warning)."
  steps: "sudo cp -a the newest backup folder to /root/drill-test/<same name>; delete HMAC-SHA256 there and run restore-drill.sh on it (expect refusal mentioning --allow-unsigned); restore the file, copy an older backup's db.dump.enc over it (expect 'fails its keyed checksum'); remove /root/drill-test afterwards."
  last: ""
