# Checks that need a person (a real phone, a real mailbox, the real VM). Not run
# automatically: every report lists them as "need a person" until done.
# `last` = when it was last done and what happened (no names, no addresses).
- key: passkey sign-in on a phone
  check: "Sign in with a passkey on an iPhone and an Android phone through portal-dev (Cloudflare Access first)."
  steps: "New private window; Access login; portal 'Sign in with a passkey'; confirm the home page loads."
  last: "2026-11-25: passkey and authenticator app set up by the first officer on desktop"
- key: authenticator app codes accepted
  check: "A code from an authenticator app is accepted at sign-in, including one taken just before it rolls over."
  steps: "Sign out; sign in with password; enter a code with 2-3 seconds left on it."
  last: "2026-11-25: works after the tolerance fix"
- key: invitation email arrives and works
  check: "A board invitation reaches a real mailbox (Hostinger, SPF/DKIM pass) and the link creates the account in that browser."
  steps: "Invite a test person; check the message headers for dkim=pass; accept; add a passkey within the hour."
  last: "not done yet (POC redirects mail to one inbox)"
- key: enrollment window expiry
  check: "An invited person who closes the browser before adding a passkey or app is shown 'Your account isn't set up yet' next time and needs a new invitation."
  steps: "Accept an invitation, close the browser without enrolling; sign in again with the password."
  last: "not done yet"
- key: assisted reset end to end
  check: "Two board members reset a lost authenticator; the code works once in the owner's browser; the owner enrolls a new one."
  steps: "Board member A starts the reset, B approves and reads the code by phone, the owner signs in and enters it."
  last: "not done yet (needs a second board member)"
- key: restore drill
  check: "Restore last night's encrypted backup into a scratch VM and run migrations (required before real data)."
  steps: "docs/runbook.md 'Backups'; record the time it took."
  last: "not done yet"
- key: deploy on the POC VM
  check: "git pull and start-portal.sh on the VM bring every service up healthy, tunnel registered."
  steps: "VM console as hoa: cd /opt/hoa-portal && git pull --ff-only && sudo bash infra/poc/start-portal.sh"
  last: "2026-11-25: Milestone 1 deploy healthy"
- key: gemini reads a scanned acknowledgement form
  check: "With GEMINI_API_KEY set on the POC, a hand-filled acknowledgement form is read into the right proposals."
  steps: "Print an ARC request's acknowledgement form; fill two blocks by hand (one no objection, one object); scan or photograph it; upload it under 'Neighbor not online? Use the paper form'; press 'Read automatically'; refresh after a minute; confirm both."
  last: ""
- key: restore drill on the POC VM
  check: "The newest nightly backup restores into a throwaway copy and passes its checks."
  steps: "sudo bash /opt/hoa-portal/infra/poc/restore-drill.sh"
  last: ""
- key: health alert email arrives
  check: "Stopping the worker produces a health email to the sysadmins within 30 minutes, and a recovery email after restarting it."
  steps: "docker compose ... stop worker; wait; check inbox; docker compose ... start worker"
  last: ""
- key: ballot link on a phone
  check: "A personal ballot link opens on a phone after sign-in, asks for the password or passkey before the ballot is recorded, and a forwarded copy does nothing."
  steps: "Open a test election; open the email on a phone; sign in; cast; forward the same email to a second test owner and open it there (expect 'can't be used')."
  last: ""
- key: install update button
  check: "System status shows Update available after a push to main, and Install update brings the VM to the new version without terminal access."
  steps: "Push a harmless change to main; within 15 minutes System status shows Update available; press Install update; within a few minutes the Version box shows the new commit."
  last: ""
- key: scanner reloads in place
  check: "On the VM, ClamAV runs with ConcurrentDatabaseReload disabled and memory stays near one signature copy during a reload."
  steps: "docker compose exec clamav clamconf -n | grep Concurrent (expect disabled); watch docker stats during a freshclam update; upload a test file just after and see it scanned once the reload finishes."
  last: ""
